        "id": "description",
        "title": "Description",
        "text": [
          "An industrial concrete mixer runs in the basement of Castle House. A camera mounted inside the drum transmits what it sees, live, into a kaleidoscope projection, where it is blended in real time with archival material and fragments of literary text.",
          "The piece is a physical embodiment of the melting pot. As the drum turns, everything inside is folded together, and the projection asks what gets lost in that process: culture, power, identity, kindness and empathy.",
          "Concrete moves on from Working Backwards (2023). Where those pieces used generative systems hand-coded by the artist, Concrete was built with AI-assisted tooling, giving the live mix a mixing-desk range of parameters. The whole visual chain runs live on a Raspberry Pi, with no rendering pass. With less attention going into writing code, more went into the physical demands of running real machinery in a festival space, from power draw to reliability."
